# Usage:
#   Development:  docker compose up dev
#   Production:   docker compose --profile production up production
#   Test:         docker compose --profile test run --rm test
#   Build only:   docker compose --profile build run --rm build

x-build-args: &build-args
  NODE_VERSION: '24'
  PNPM_VERSION: '10.29.2'

services:
  # Development with hot reloading
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        <<: *build-args
    container_name: website-dev
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app:cached
      - node_modules:/app/node_modules
      - pnpm-store:/home/node/.local/share/pnpm/store
      - playwright-browsers:/home/node/.cache/ms-playwright
    ports:
      - '4321:4321'
    command: pnpm run dev
    tty: true
    stdin_open: true

  # Production preview
  production:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        <<: *build-args
    container_name: website-production
    environment:
      - NODE_ENV=production
    ports:
      - '4321:4321'
    profiles:
      - production

  # Run unit and e2e tests
  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
      args:
        <<: *build-args
    container_name: website-test
    environment:
      - NODE_ENV=test
      - CI=true
    volumes:
      - .:/app:cached
      - node_modules:/app/node_modules
      - playwright-browsers:/home/node/.cache/ms-playwright
    profiles:
      - test
    command: sh -c "pnpm test run && pnpm test:e2e"

  # Build production assets (outputs to ./dist on host)
  build:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
      args:
        <<: *build-args
    container_name: website-build
    environment:
      - NODE_ENV=production
    volumes:
      - .:/app:cached
      - node_modules:/app/node_modules
    profiles:
      - build
    command: pnpm run build

volumes:
  node_modules:
    name: website-node-modules
  pnpm-store:
    name: website-pnpm-store
  playwright-browsers:
    name: website-playwright-browsers
